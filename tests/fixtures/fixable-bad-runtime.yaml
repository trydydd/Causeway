# yaml-language-server: $schema=https://causeway.internal/schema/manifest/v1
# FIXABLE: runtime value not in enum — agent can correct to a valid value
apiVersion: causeway/v1
name: shift-planner
description: >
  Generates a daily shift schedule for the warehouse team based on staff
  availability. Used by one team lead to plan their own team's shifts.
runtime: python3.10
entrypoint: python app.py
port: 8080
healthEndpoint: /health
tier: personal-team
dataSources: []
envVars: []
