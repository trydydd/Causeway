name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate-schema:
    name: Validate JSON Schema (metaschema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema
      - run: check-jsonschema --check-metaschema schema/causeway-manifest.schema.json

  validate-generated-files:
    name: Generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./validator
      - run: python scripts/generate.py
      - run: git diff --exit-code

  test-validator:
    name: Validator tests
    runs-on: ubuntu-latest
    needs: validate-schema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./validator pytest
      - run: pytest tests/ -v

  validate-scaffold-manifest:
    name: Scaffold manifest passes cwy validate
    runs-on: ubuntu-latest
    needs: test-validator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./validator
      - run: cwy validate scaffold/causeway.yaml --json
